[project]
name = "observable-mcp"
version = "0.1.0"
description = "An observable MCP server exposing web-insight tools, instrumented with Prometheus/Grafana."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2.0",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "behave>=1.2.6",
    "selenium>=4.20",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
observable-mcp = "mcp_server.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]